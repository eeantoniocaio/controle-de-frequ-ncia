name: Prevent Supabase Pause

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual run

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secret is not set."
            exit 1
          fi
          
          echo "Pinging Supabase at $SUPABASE_URL..."
          
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/classes?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
            
          if [ "$response" -eq 200 ] || [ "$response" -eq 206 ]; then
            echo "Success! Supabase responded with $response."
          else
            echo "Failed to ping Supabase. Status: $response"
            exit 1
          fi

